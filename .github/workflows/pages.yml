name: Test and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test and build
        run: |
          npm test
          npm run validate
          npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble static site
        run: |
          mkdir _site
          cp index.html styles.css Vapora-Process-Studio.html _site/
          cp -R src _site/src
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published application assets
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import os, time, urllib.request
          base = os.environ['SITE_URL'].rstrip('/') + '/'
          checks = {
              '': 'src/main.js',
              'src/main.js': 'globalThis.vapora=',
              'src/worker.js': 'simulate',
              'styles.css': ':root',
              'Vapora-Process-Studio.html': '__VAPORA_WORKER_SOURCE__',
          }
          for path, marker in checks.items():
              for attempt in range(12):
                  try:
                      request = urllib.request.Request(base + path, headers={'Cache-Control': 'no-cache'})
                      with urllib.request.urlopen(request, timeout=20) as response:
                          text = response.read().decode('utf-8')
                          if marker not in text:
                              raise ValueError('Expected application content was not served')
                      print('Verified: ' + base + path)
                      break
                  except Exception:
                      if attempt == 11:
                          raise
                      time.sleep(5)
          PY
